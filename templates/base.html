{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TruthLens{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body data-page="{% block page_id %}base{% endblock %}">
    <div class="grid-background"></div>
    <div class="grain-overlay"></div>
    <header class="site-header glass-nav">
        <a class="brand" href="{% url 'index' %}">
            <span class="brand-mark">
                <span class="lens-core"></span>
                <span class="scanline"></span>
            </span>
            <span class="brand-word">TruthLens</span>
        </a>
        <nav class="site-nav">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'history' %}">History</a>
            <a href="{% url 'analytics' %}">Analytics</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <div id="toast-container" class="toast-stack"></div>
    <script>
        window.truthlensConfig = {
            csrfToken: "{{ csrf_token }}",
            urls: {
                detect: "{% url 'detect_api' %}",
                history: "{% url 'history_api' %}",
                analyticsLive: "{% url 'analytics_live_api' %}",
                analyticsChart: "{% url 'analytics_chart_api' %}",
                exportCsv: "{% url 'export_csv_api' %}"
            }
        };
    </script>
    <script src="{% static 'js/app.js' %}"></script>
    <script src="{% static 'js/realtime.js' %}"></script>
    <script src="{% static 'js/upload.js' %}"></script>
    <script src="{% static 'js/history.js' %}"></script>
    <script src="{% static 'js/analytics.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
