{% extends 'base.html' %}
{% block title %}TruthLens | History{% endblock %}
{% block page_id %}history{% endblock %}
{% block content %}
<section class="page-shell">
    <div class="panel-header history-header">
        <div>
            <p class="eyebrow">Archive</p>
            <h1>Detection history</h1>
        </div>
        <a class="button button-secondary" href="{% url 'export_csv_api' %}">Export CSV</a>
    </div>

    <section class="scan-card filter-bar">
        <input id="history-search" type="search" placeholder="Search file name or explanation">
        <select id="history-type">
            <option value="">All types</option>
            <option value="video">Video</option>
            <option value="audio">Audio</option>
            <option value="image">Image</option>
        </select>
        <select id="history-verdict">
            <option value="">All verdicts</option>
            <option value="fake">Deepfake</option>
            <option value="real">Authentic</option>
            <option value="uncertain">Uncertain</option>
        </select>
    </section>

    <section class="scan-card history-table-shell">
        <div id="history-list" class="history-list"></div>
        <div id="history-pagination" class="pagination-row"></div>
    </section>
</section>
{% endblock %}
